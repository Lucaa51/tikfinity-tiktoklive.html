<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TikFinity Sequenzen mit Events</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
  }

  iframe {
    position: absolute;
    width: 100%;
    height: 100%;
    border: none;
    opacity: 0;
    transition: opacity 1s ease-in-out;
    pointer-events: none;
  }

  iframe.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* Hervorhebung bei Event */
  iframe.highlight {
    box-shadow: 0 0 50px gold;
    transform: scale(1.05);
    transition: all 0.5s ease;
  }
</style>
</head>
<body>

<!-- TickFinity Widgets -->
<iframe src="https://tikfinity.zerody.one/widget/topliker?cid=14363" class="active"></iframe>
<iframe src="https://tikfinity.zerody.one/widget/topgifter?cid=14363"></iframe>
<iframe src="https://tikfinity.zerody.one/widget/topg?cid=14363"></iframe>
<iframe src="https://tikfinity.zerody.one/widget/tops?cid=14363"></iframe>
<iframe src="https://tikfinity.zerody.one/widget/gcounter?cid=14363&c=1"></iframe>

<script>
const iframes = document.querySelectorAll('iframe');
let current = 0;

// Sequenz-Loop alle 10 Sekunden
setInterval(() => {
  iframes[current].classList.remove('active');
  current = (current + 1) % iframes.length;
  iframes[current].classList.add('active');
}, 10000);

// WebSocket-Verbindung zu TikFinity
const socket = new WebSocket('ws://localhost:21213/');

socket.addEventListener('open', () => {
  console.log('Verbunden mit TikFinity WebSocket');
});

socket.addEventListener('message', (event) => {
  const data = JSON.parse(event.data);
  console.log('Event erhalten:', data);

  // Beispiel: Wenn ein Geschenk kommt, highlight aktuelle Sequenz
  if (data.type === 'gift') {
    iframes[current].classList.add('highlight');
    setTimeout(() => iframes[current].classList.remove('highlight'), 1000);
  }

  // Beispiel: Wenn ein Like kommt, ebenfalls highlight
  if (data.type === 'like') {
    iframes[current].classList.add('highlight');
    setTimeout(() => iframes[current].classList.remove('highlight'), 500);
  }
});

socket.addEventListener('close', () => console.log('WebSocket geschlossen'));
socket.addEventListener('error', (err) => console.error('WebSocket Fehler:', err));
</script>

</body>
</html>
